<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- theme-color is filled in from the active theme's --bg (src/app/theme.ts) -->
    <meta name="theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Counter app for a laundry shop — offline, no subscription." />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Laundry Shop OS</title>
    <script>
      // spec.md § Theming 6 — applied before first paint, so a launch never
      // flashes the wrong theme. Keep this inline and blocking.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'coldwash'
      } catch (e) {
        document.documentElement.dataset.theme = 'coldwash'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
